<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="clSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8ECE9"/>
      <stop offset="100%" stop-color="#CED6D0"/>
    </linearGradient>
    <pattern id="clMesh" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 10 0 L 20 10 L 10 20 Z" fill="none" stroke="#60666D" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#clSky)"/>
  <rect y="440" width="800" height="160" fill="#4B6650"/>
  <rect y="470" width="800" height="130" fill="#3B5240"/>
  <!-- Top rail -->
  <rect x="50" y="180" width="700" height="14" fill="#717880" rx="4" stroke="#484E54" stroke-width="1.5"/>
  <!-- Tension wire bottom -->
  <line x1="50" y1="440" x2="750" y2="440" stroke="#484E54" stroke-width="2"/>
  <!-- Mesh body -->
  <rect x="50" y="190" width="700" height="250" fill="url(#clMesh)"/>
  <!-- Terminal posts -->
  <rect x="42" y="160" width="16" height="300" fill="#889098" stroke="#484E54" stroke-width="2" rx="4"/>
  <circle cx="50" cy="158" r="10" fill="#717880" stroke="#484E54" stroke-width="1.5"/>
  <rect x="392" y="168" width="14" height="290" fill="#889098" stroke="#484E54" stroke-width="1.5" rx="3"/>
  <circle cx="399" cy="166" r="8" fill="#717880" stroke="#484E54" stroke-width="1.5"/>
  <rect x="742" y="160" width="16" height="300" fill="#889098" stroke="#484E54" stroke-width="2" rx="4"/>
  <circle cx="750" cy="158" r="10" fill="#717880" stroke="#484E54" stroke-width="1.5"/>
</svg>