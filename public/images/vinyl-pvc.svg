    <line x1="450" y1="170" x2="450" y2="440"/>
    <line x1="110" y1="170" x2="110" y2="440"/>
    <line x1="480" y1="170" x2="480" y2="440"/>
    <line x1="140" y1="170" x2="140" y2="440"/>
    <line x1="510" y1="170" x2="510" y2="440"/>
    <line x1="170" y1="170" x2="170" y2="440"/>
    <line x1="540" y1="170" x2="540" y2="440"/>
    <line x1="200" y1="170" x2="200" y2="440"/>
    <line x1="570" y1="170" x2="570" y2="440"/>
    <line x1="230" y1="170" x2="230" y2="440"/>
    <line x1="600" y1="170" x2="600" y2="440"/>
    <line x1="260" y1="170" x2="260" y2="440"/>
    <line x1="630" y1="170" x2="630" y2="440"/>
    <line x1="290" y1="170" x2="290" y2="440"/>
    <line x1="660" y1="170" x2="660" y2="440"/>
    <line x1="320" y1="170" x2="320" y2="440"/>
    <line x1="690" y1="170" x2="690" y2="440"/>
    <line x1="350" y1="170" x2="350" y2="440"/>
    <line x1="720" y1="170" x2="720" y2="440"/>
