<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="vpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F1F5"/>
      <stop offset="100%" stop-color="#D0E3EC"/>
    </linearGradient>
    <linearGradient id="vinylPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F3F5F7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E8EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#vpSky)"/>
  <rect y="440" width="800" height="160" fill="#3F6B48"/>
  <rect y="470" width="800" height="130" fill="#325439"/>
  <!-- Vinyl Sections -->
  <rect x="60" y="160" width="310" height="290" fill="url(#vinylPanel)" stroke="#CBD2D9" stroke-width="2" rx="4"/>
  <rect x="430" y="160" width="310" height="290" fill="url(#vinylPanel)" stroke="#CBD2D9" stroke-width="2" rx="4"/>
