  <!-- Top and bottom structural rails -->
  <rect x="56" y="152" width="318" height="22" fill="#E2E7EC" stroke="#CBD2D9" stroke-width="1.5" rx="3"/>
  <rect x="426" y="152" width="318" height="22" fill="#E2E7EC" stroke="#CBD2D9" stroke-width="1.5" rx="3"/>
  <rect x="56" y="430" width="318" height="24" fill="#E2E7EC" stroke="#CBD2D9" stroke-width="1.5" rx="3"/>
  <rect x="426" y="430" width="318" height="24" fill="#E2E7EC" stroke="#CBD2D9" stroke-width="1.5" rx="3"/>
